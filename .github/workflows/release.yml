name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate release notes with ai-changelog
        id: notes
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          args=()
          if [ -n "$prev" ]; then args+=(--from "$prev"); fi
          npx --yes github:stevengeyue/ai-changelog \
            --repo . --to "${{ github.ref_name }}" \
            --set-version "${GITHUB_REF_NAME#v}" \
            --format md "${args[@]}" > notes.md
          echo "Generated release notes from ${prev:-first-commit} to ${{ github.ref_name }}"
      - name: Verify release notes
        shell: bash
        run: |
          grep -q "## \[${GITHUB_REF_NAME#v}\]" notes.md && echo "OK: notes version matches tag" || { echo "FAIL: notes version does not match tag"; cat notes.md; exit 1; }
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh --version | head -1
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release exists -> edit"
            gh release edit "${{ github.ref_name }}" --notes-file notes.md --draft=false
          else
            echo "no release -> create"
            gh release create "${{ github.ref_name }}" --notes-file notes.md --draft=false
          fi
          gh release view "${{ github.ref_name }}" --json tagName,name,draft -q "." | tee -a "$GITHUB_STEP_SUMMARY"
