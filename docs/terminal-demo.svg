<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#151a22"/>
    </linearGradient>
  </defs>
  <rect width="760" height="420" rx="10" fill="url(#bg)"/>
  <rect x="0" y="0" width="760" height="38" rx="10" fill="#2a3242"/>
  <circle cx="22" cy="19" r="7" fill="#ff5f57"/>
  <circle cx="46" cy="19" r="7" fill="#febc2e"/>
  <circle cx="70" cy="19" r="7" fill="#28c840"/>
  <text x="380" y="25" text-anchor="middle" fill="#8b93a7" font-size="14">bash — ai-changelog</text>

  <text x="24" y="78" fill="#8b93a7" font-size="13">$ npx ai-changelog --lang zh --write</text>
  <text x="24" y="108" fill="#6ab0f3" font-size="13">✦ 正在分析 git 历史（v1.0.0..HEAD，12 commits）...</text>
  <text x="24" y="132" fill="#6ab0f3" font-size="13">✦ Provider: deepseek · 建议版本: 1.1.0 (minor)</text>

  <text x="24" y="170" fill="#f0f2f6" font-size="14" font-weight="bold">## [1.1.0] - 2026-08-15</text>

  <text x="24" y="200" fill="#ff6b6b" font-size="13" font-weight="bold">💥 破坏性变更</text>
  <text x="44" y="222" fill="#d7dce6" font-size="13">- 移除 Node 16 支持，最低要求 Node 18</text>

  <text x="24" y="252" fill="#4cd964" font-size="13" font-weight="bold">✨ 新增</text>
  <text x="44" y="274" fill="#d7dce6" font-size="13">- 支持 DeepSeek / Anthropic / Ollama 多种 LLM Provider</text>
  <text x="44" y="294" fill="#d7dce6" font-size="13">- 无 API Key 时自动降级到内置规则引擎</text>

  <text x="24" y="324" fill="#ffcc00" font-size="13" font-weight="bold">🐛 修复</text>
  <text x="44" y="346" fill="#d7dce6" font-size="13">- 修复 --write 时 CHANGELOG.md 头部重复的问题</text>

  <text x="24" y="386" fill="#4cd964" font-size="13">✓ 已写入 CHANGELOG.md（12 条提交 → 6 个要点）</text>
